name: Android Widget APK
on:
  push:
    branches:
      - feature/android-couple-widgets
    paths:
      - 'android-widget/**'
      - '.github/workflows/android-widget.yml'
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        working-directory: android-widget
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Check built APK
        run: test -s android-widget/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: PlansForTwoWidget-APK
          path: android-widget/app/build/outputs/apk/debug/app-debug.apk
